<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Architecture E2E History</title>
<style>
  :root {
    --bg: #14151b;
    --panel: #1a1c24;
    --card: #20222c;
    --card-hover: #252835;
    --line: #2b2e3b;
    --text: #e4e5ea;
    --muted: #868ba0;
    --faint: #5b6075;
    --active: #8be9fd;
    --pass: #50fa7b;
    --changes: #ffb86c;
    --human: #ff5555;
    --merged: #bd93f9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* Header */
  header {
    display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; padding: 28px 32px 8px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--pass); margin-right: 6px; vertical-align: 1px;
  }
  .status.error { color: var(--human); }
  .status.error .dot { background: var(--human); }
  .banner {
    margin: 12px 32px 0; padding: 10px 14px; border: 1px solid var(--human);
    border-radius: 8px; color: var(--human); font-family: var(--mono); font-size: 12px;
  }

  /* Board */
  .board {
    display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px;
    padding: 20px 32px 40px; align-items: start;
  }
  .col { min-width: 0; }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 0 2px 10px;
    border-bottom: 1px solid var(--line); margin-bottom: 12px; position: relative;
  }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 600; }
  .col-head .who { font-size: 11px; color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .count {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted);
  }
  .col:not(:last-child):not(:nth-last-child(2)) .col-head::after {
    content: "›"; position: absolute; right: -10px; top: -2px; color: var(--faint); font-size: 16px;
  }
  .col.human .col-head { border-bottom-color: color-mix(in srgb, var(--human) 55%, transparent); }
  .col.human h2 { color: var(--human); }
  /* Branch track: where a job's PRs have landed (env and release strategies). */
  .track { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0 2px; font-family: var(--mono); font-size: 10.5px; }
  .track span { padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted, #8a8fa3); }
  .track .landed { border-color: color-mix(in srgb, var(--pass) 60%, transparent); color: var(--pass); }
  .track .open { border-color: color-mix(in srgb, var(--active, #8be9fd) 60%, transparent); color: var(--active, #8be9fd); }
  .branching { font-family: var(--mono); font-size: 12px; color: var(--muted, #8a8fa3); margin-left: auto; margin-right: 16px; }
  .col.merged-col h2 { color: var(--merged); }
  .empty { color: var(--faint); font-size: 12px; padding: 4px 2px; }

  /* Cards */
  .card {
    display: block; width: 100%; text-align: left; cursor: pointer; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 12px 10px; margin-bottom: 10px;
    transition: background .15s, border-color .15s, transform .15s;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  .card.live { border-color: color-mix(in srgb, var(--active) 35%, var(--line)); }
  .card.human {
    border-color: var(--human);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent),
                0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent);
  }
  .card.done { opacity: .72; }
  .card.rejected .feature { text-decoration: line-through; text-decoration-color: var(--faint); }
  .flag.wait { color: var(--changes); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .card-top .num { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pulse {
    width: 7px; height: 7px; border-radius: 50%; background: var(--active);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .flag {
    margin-left: auto; font-size: 10px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--human); white-space: nowrap;
  }
  .feature { font-size: 13px; line-height: 1.4; margin: 0 0 6px; }
  .links { display: flex; gap: 10px; font-family: var(--mono); font-size: 11px; }
  .links a { color: var(--active); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .meta { display: flex; gap: 10px; margin-top: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
  .meta .risk-high { color: var(--human); } .meta .risk-medium { color: var(--changes); }
  .chip.gate { flex: 0 0 38px; }
  .chip.FAIL { border: 1px solid transparent; color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .branch {
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .rounds { margin-top: 10px; display: grid; gap: 5px; }
  .round { display: flex; align-items: center; gap: 4px; }
  .round .r { font-family: var(--mono); font-size: 10px; color: var(--faint); width: 20px; }
  .chip {
    flex: 1; text-align: center; font-family: var(--mono); font-size: 10px;
    padding: 2px 0; border-radius: 4px; border: 1px dashed var(--faint); color: var(--faint);
  }
  .chip.wait { animation: breathe 1.6s ease-in-out infinite; }
  .chip.PASS {
    border: 1px solid transparent; color: var(--pass);
    background: color-mix(in srgb, var(--pass) 14%, transparent);
  }
  .chip.CHANGES {
    border: 1px solid transparent; color: var(--changes);
    background: color-mix(in srgb, var(--changes) 16%, transparent);
  }
  .chip.bad { border: 1px solid var(--human); color: var(--human); }
  .hint {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 1.6;
    overflow-wrap: anywhere;
  }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .chip.wait { animation: none; } }

  /* Drawer */
  .scrim {
    position: fixed; inset: 0; background: rgba(5, 6, 10, .55);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100vw);
    background: var(--panel); border-left: 1px solid var(--line);
    display: grid; grid-template-rows: auto 1fr; transform: translateX(100%);
    transition: transform .25s ease;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; }
  .d-head { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head .num { font-size: 12px; }
  .d-head h3 { margin: 4px 40px 6px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .close {
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
    border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .d-body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
  .files .group {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--faint); margin: 12px 8px 4px;
  }
  .files .group:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .file:hover { background: var(--card); color: var(--text); }
  .file.on { background: var(--card-hover); color: var(--text); }
  .file .rn { display: none; }
  .file .v { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .v.good { background: var(--pass); } .v.warn { background: var(--changes); } .v.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }

  /* Rendered markdown */
  .md { max-width: 680px; line-height: 1.65; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code {
    font-family: var(--mono); font-size: 12px; background: var(--card);
    padding: 1px 5px; border-radius: 4px;
  }
  .md pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md a { color: var(--active); }
  .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .verdict {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px; margin-bottom: 14px;
  }
  .verdict + * { margin-top: .4em; }
  .md .head { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: -6px 0 14px; white-space: pre-line; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .note { color: var(--faint); font-size: 13px; }
  .md .summary {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 16px 4px; margin: 0 0 22px;
  }
  .md .summary h2 {
    margin: 0 0 6px; font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted);
  }
  .md .summary ul { margin: 0 0 .6em; }

  footer {
    padding: 0 32px 32px; font-family: var(--mono); font-size: 11px; color: var(--faint);
    display: flex; gap: 20px; flex-wrap: wrap;
  }

  @media (max-width: 1100px) {
    .board { grid-template-columns: repeat(4, minmax(0, 1fr)); row-gap: 28px; }
    .col-head::after { display: none; }
  }
  @media (max-width: 640px) {
    header { padding: 20px 16px 4px; }
    .banner { margin: 12px 16px 0; }
    .board { grid-template-columns: 1fr; padding: 16px 16px 32px; }
    footer { padding: 0 16px 24px; }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files {
      border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px;
      overflow-x: auto; padding: 8px;
    }
    .files .group { display: none; }
    .file { width: auto; white-space: nowrap; }
    .file .rn { display: inline; white-space: pre; }
    .doc { padding: 18px 16px 48px; }
  }

  /* History page */
  header .nav a { color: var(--active); text-decoration: none; font-family: var(--mono); font-size: 12px; }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 16px 32px 0; }
  .tools input, .tools select {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font: inherit; font-size: 13px;
  }
  .tools input { min-width: 260px; flex: 1; max-width: 420px; }
  .tools .count { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: auto; }
  .list { padding: 16px 32px 48px; }
  .hjob {
    display: grid; grid-template-columns: 210px 64px minmax(0, 1fr) 96px 220px 92px; gap: 14px; align-items: center;
    padding: 11px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    margin-bottom: 8px; cursor: pointer;
  }
  .hjob:hover, .hjob:focus-visible { background: var(--card-hover); outline: none; }
  .hjob .id, .hjob .issue, .hjob .when { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .hjob .title { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hjob .meta { font-family: var(--mono); font-size: 11px; color: var(--faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .outcome { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); text-align: center; }
  .outcome.merged { color: var(--merged); border-color: color-mix(in srgb, var(--merged) 55%, transparent); }
  .outcome.rejected { color: var(--human); border-color: color-mix(in srgb, var(--human) 55%, transparent); }
  .prs { display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--mono); font-size: 11px; }
  .prs a, .prs span { padding: 1px 6px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-decoration: none; }
  .prs a.merged { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 50%, transparent); }
  .month { font-family: var(--mono); font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; margin: 18px 2px 8px; }
  .month:first-child { margin-top: 0; }
  .help { margin: 32px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); }
  .help code { font-family: var(--mono); color: var(--text); }
  @media (max-width: 900px) {
    .hjob { grid-template-columns: 1fr auto; }
    .hjob .id, .hjob .issue, .hjob .prs, .hjob .when { display: none; }
    .list, .tools { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Architecture E2E history</h1>
  <div class="nav"><a href="dashboard.html">← board</a></div>
  <div class="status" id="status">loading…</div>
</header>
<div class="tools">
  <input id="q" type="search" placeholder="Search title, job, issue, repo, text in spec…" aria-label="Search">
  <select id="outcome" aria-label="Outcome">
    <option value="">all outcomes</option><option value="merged">merged</option><option value="rejected">rejected</option>
  </select>
  <select id="repo" aria-label="Repo"><option value="">all repos</option></select>
  <span class="count" id="count"></span>
</div>
<main class="list" id="list"></main>

<div id="overlay">
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div class="num" id="d-num"></div>
      <h3 id="d-title"></h3>
      <div class="links" id="d-links"></div>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="d-body">
      <nav class="files" id="d-files"></nav>
      <article class="doc"><div class="md" id="d-doc"></div></article>
    </div>
  </aside>
</div>

<script>
// The record of finished factory jobs, read from docs/history/ (written by factory/bin/job).
// Needs factory/bin/serve: `python3 -m http.server` inside factory/ can't reach docs/.
const BASE = '../docs/history/'
const FILE_ORDER = ['README.md', 'issue.md', 'intake.md', 'research.md', 'spec.md', 'build.md',
  'decision.md', 'rejection.md']
let records = []
let openId = null
let openPath = null
const texts = new Map()   // "<id>/<file>" -> text, for search and the drawer

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])


async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res.text()
}


// python -m http.server serves an HTML index for directories; read its links.
async function listFiles(dir) {
  const doc = new DOMParser().parseFromString(await fetchText(dir), 'text/html')
  const hrefs = [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
  const out = []
  for (const h of hrefs) {
    if (h.endsWith('/')) out.push(...(await listFiles(dir + h)).map((f) => h + f))
    else if (h.endsWith('.md')) out.push(h)
  }
  return out
}


function tone(first) {
  if (/^(VERDICT:\s*PASS|GATE:\s*PASS|APPROVE|STATUS:\s*READY|DECISION:\s*ACCEPT)$/.test(first)) return 'good'
  if (/^(VERDICT:\s*CHANGES|DECISION:\s*NEEDS-INFO)$/.test(first)) return 'warn'
  if (/^(ESCALATE|REJECTED|STATUS:\s*BLOCKED|GATE:\s*FAIL|DECISION:\s*REJECT)$/.test(first)) return 'stop'
  return null
}


// ---- Markdown (just enough for the factory's files) ---------------------

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

// Every step's file has a `## Summary` of a few bullets; show it first, in a box.
function splitSummary(lines) {
  const start = lines.findIndex((l) => /^##\s+Summary\s*$/.test(l))
  if (start === -1) return { lines, summary: null }
  let end = start + 1
  while (end < lines.length && !/^#{1,2}\s/.test(lines[end])) end++
  return {
    lines: [...lines.slice(0, start), ...lines.slice(end)],
    summary: lines.slice(start + 1, end).join('\n'),
  }
}

function markdown(src) {
  const split = splitSummary(src.replace(/\r/g, '').split('\n'))
  const lines = split.lines
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) {
    html += `<div class="verdict ${t}">${esc(first)}</div>`
    i = 1
    // The rest of a KEY: value header block (intake.md, checks.md).
    const extra = []
    while (i < lines.length && /^[A-Z-]+:\s/.test(lines[i])) extra.push(lines[i++])
    if (extra.length) html += `<div class="head">${esc(extra.join('\n'))}</div>`
  }
  if (split.summary !== null) html += `<section class="summary"><h2>Summary</h2>${markdown(split.summary)}</section>`

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${markdown(body.join('\n'))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}



function rank(f) {
  if (FILE_ORDER.includes(f)) return [0, FILE_ORDER.indexOf(f), f]
  if (f.startsWith('feedback-')) return [1, 0, f]
  if (f.startsWith('final-round/')) return [2, f.endsWith('checks.md') ? 0 : 1, f]
  return [3, 0, f]
}
const sorted = (files) => files.sort((a, b) => {
  const [x, y] = [rank(a), rank(b)]
  return x[0] - y[0] || x[1] - y[1] || x[2].localeCompare(y[2])
})

async function load() {
  let listing
  try { listing = await fetchText(BASE) } catch {
    $('status').textContent = 'docs/history not reachable'
    $('list').innerHTML = `<div class="help">This page reads <code>docs/history/</code>, which is outside
      <code>factory/</code>. Start the server from the hub with <code>factory/bin/serve</code> and open
      <code>http://localhost:8000/</code>. If the folder is empty, no job has finished since archiving
      was added: <code>factory/bin/job archive --all</code>.</div>`
    return
  }
  const doc = new DOMParser().parseFromString(listing, 'text/html')
  const ids = [...doc.querySelectorAll('a')].map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((h) => h.endsWith('/')).map((h) => h.slice(0, -1))
  records = (await Promise.all(ids.map(async (id) => {
    try { return JSON.parse(await fetchText(`${BASE}${id}/job.json`)) } catch { return null }
  }))).filter(Boolean)
  records.sort((a, b) => (b.ended || '').localeCompare(a.ended || '') || b.id.localeCompare(a.id))
  const repos = [...new Set(records.flatMap((r) => Object.entries(r.repos || {}).filter(([, v]) => v.changed).map(([k]) => k)))].sort()
  $('repo').innerHTML = '<option value="">all repos</option>' + repos.map((k) => `<option>${esc(k)}</option>`).join('')
  // Text of the main files, so search can look inside them.
  await Promise.all(records.flatMap((r) => ['issue.md', 'spec.md', 'decision.md'].map(async (f) => {
    try { texts.set(`${r.id}/${f}`, await fetchText(`${BASE}${r.id}/${f}`)) } catch { /* missing is fine */ }
  })))
  const total = records.reduce((s, r) => s + Number(r.cost_usd || 0), 0)
  $('status').textContent = `${records.length} finished job${records.length === 1 ? '' : 's'} · $${total.toFixed(2)}`
  render()
  if (location.hash.length > 1) openDrawer(decodeURIComponent(location.hash.slice(1)))
}

function prs(r) {
  const out = []
  for (const [k, v] of Object.entries(r.repos || {})) {
    if (!v.changed) continue
    const list = Object.entries(v.prs || {})
    if (!list.length) out.push(`<span>${esc(k)}</span>`)
    for (const [branch, pr] of list) {
      const label = `${esc(k)}#${pr.pr}${list.length > 1 ? `→${esc(branch)}` : ''}`
      out.push(pr.url ? `<a class="${pr.merged ? 'merged' : ''}" href="${esc(pr.url)}" target="_blank" rel="noopener">${label}</a>`
        : `<span>${label}</span>`)
    }
  }
  return out.join('')
}

function matches(r, q, outcome, repo) {
  if (outcome && r.stage !== outcome) return false
  if (repo && !(r.repos?.[repo]?.changed)) return false
  if (!q) return true
  const hay = [r.id, `#${r.issue}`, r.title, r.shipped, ...Object.keys(r.repos || {}),
    ...['issue.md', 'spec.md', 'decision.md'].map((f) => texts.get(`${r.id}/${f}`) || '')].join(' ').toLowerCase()
  return q.toLowerCase().split(/\s+/).every((w) => hay.includes(w))
}

function render() {
  const q = $('q').value.trim(), outcome = $('outcome').value, repo = $('repo').value
  const shown = records.filter((r) => matches(r, q, outcome, repo))
  $('count').textContent = shown.length === records.length ? '' : `${shown.length} of ${records.length}`
  let month = null
  $('list').innerHTML = shown.map((r) => {
    const m = (r.ended || '').slice(0, 7)
    const head = m !== month ? `<div class="month">${esc(m || 'undated')}</div>` : ''
    month = m
    const risk = r.intake?.risk ? ` · risk ${esc(r.intake.risk)}` : ''
    return `${head}<div class="hjob" tabindex="0" data-job="${esc(r.id)}">
      <div class="id">${esc(r.id)}</div>
      <div class="issue">#${esc(r.issue)}</div>
      <div><div class="title">${esc(r.title)}</div>
        <div class="meta">${r.round} round${r.round === 1 ? '' : 's'}${risk} · ${esc(r.strategy || 'trunk')}${r.shipped ? ` · ${esc(r.shipped)}` : ''} · $${Number(r.cost_usd || 0).toFixed(2)}</div></div>
      <div class="outcome ${esc(r.stage)}">${esc(r.stage)}</div>
      <div class="prs">${prs(r)}</div>
      <div class="when">${esc((r.ended || '').slice(0, 10))}</div>
    </div>`
  }).join('') || (records.length ? '<div class="help">Nothing matches.</div>'
    : '<div class="help">No finished jobs in <code>docs/history/</code> yet.</div>')
}

async function refreshDrawer() {
  const r = records.find((x) => x.id === openId)
  if (!r) {
    $('d-title').textContent = openId
    $('d-doc').innerHTML = `<p class="note">No record for ${esc(openId)} in docs/history.</p>`
    return
  }
  $('d-num').textContent = `${r.id} · ${r.stage} · #${r.issue} · ${(r.ended || '').slice(0, 10)}`
  $('d-title').textContent = r.title
  $('d-links').innerHTML = `<div class="prs">${prs(r)}</div>`
  const base = `${BASE}${r.id}/`
  const files = sorted(await listFiles(base))
  if (!openPath || !files.includes(openPath)) openPath = files[0] || null
  const get = async (f) => {
    const key = `${r.id}/${f}`
    if (!texts.has(key)) texts.set(key, await fetchText(base + f))
    return texts.get(key)
  }
  await Promise.all(files.map(get))
  let group = null
  $('d-files').innerHTML = files.map((f) => {
    const g = f.startsWith('final-round/') ? 'Final round' : 'Job'
    const head = g !== group ? `<div class="group">${g}</div>` : ''
    group = g
    const t = tone((texts.get(`${r.id}/${f}`) || '').split('\n')[0].trim())
    const name = esc(f.replace(/^final-round\//, '').replace(/^review-/, 'review: ').replace(/\.md$/, ''))
    return `${head}<button class="file ${f === openPath ? 'on' : ''}" data-file="${esc(f)}"><span class="v ${t || ''}"></span>${name}</button>`
  }).join('')
  $('d-doc').innerHTML = openPath ? markdown(texts.get(`${r.id}/${openPath}`) || '') : ''
  $('d-doc').parentElement.scrollTop = 0
}

async function openDrawer(id) {
  openId = id
  openPath = null
  document.body.classList.add('open')
  if (location.hash !== `#${id}`) history.replaceState(null, '', `#${encodeURIComponent(id)}`)
  try { await refreshDrawer() } catch (err) { $('d-doc').innerHTML = `<p class="note">${esc(err.message)}</p>` }
}

function closeDrawer() {
  openId = null
  document.body.classList.remove('open')
  history.replaceState(null, '', location.pathname)
}

document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return
  const row = e.target.closest('[data-job]')
  if (row) return openDrawer(row.dataset.job)
  const file = e.target.closest('[data-file]')
  if (file) { openPath = file.dataset.file; return refreshDrawer() }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') return closeDrawer()
  const row = e.target.closest?.('[data-job]')
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDrawer(row.dataset.job) }
})
for (const id of ['q', 'outcome', 'repo']) $(id).addEventListener('input', render)
window.addEventListener('hashchange', () => {
  const id = decodeURIComponent(location.hash.slice(1))
  if (id && id !== openId) openDrawer(id)
})

load()
</script>
</body>
</html>
